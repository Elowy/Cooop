<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" fill="none">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d46"/>
      <stop offset="1" stop-color="#215c33"/>
    </linearGradient>
  </defs>
  <rect x="30" y="40" width="420" height="300" rx="24" fill="#e7f3ec"/>

  <!-- stacked crate on a pallet -->
  <g stroke="#a87a32" stroke-width="3">
    <rect x="150" y="90" width="170" height="130" rx="6" fill="#d8a85a"/>
  </g>
  <rect x="150" y="120" width="170" height="6" fill="#b9863c"/>
  <rect x="150" y="156" width="170" height="6" fill="#b9863c"/>
  <rect x="150" y="192" width="170" height="6" fill="#b9863c"/>
  <path d="M154 216 L316 94" stroke="#a87a32" stroke-width="5" opacity=".5"/>

  <!-- quality check badge -->
  <circle cx="235" cy="74" r="18" fill="url(#hb)"/>
  <path d="M227 74l5 5 11-11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pallet base -->
  <rect x="132" y="220" width="206" height="18" rx="3" fill="#cf9a47"/>
  <rect x="140" y="238" width="26" height="22" rx="3" fill="#b9863c"/>
  <rect x="222" y="238" width="26" height="22" rx="3" fill="#b9863c"/>
  <rect x="304" y="238" width="26" height="22" rx="3" fill="#b9863c"/>

  <!-- lumber stack -->
  <g stroke="#a87a32" stroke-width="2">
    <rect x="60" y="250" width="70" height="16" rx="3" fill="#e0b878"/>
    <rect x="60" y="270" width="70" height="16" rx="3" fill="#d8a85a"/>
    <rect x="60" y="290" width="70" height="16" rx="3" fill="#e0b878"/>
  </g>

  <!-- brick stack -->
  <g stroke="#e7f3ec" stroke-width="3">
    <rect x="350" y="270" width="70" height="16" rx="2" fill="#b5532e"/>
    <rect x="350" y="290" width="70" height="16" rx="2" fill="#c25e36"/>
  </g>
</svg>
