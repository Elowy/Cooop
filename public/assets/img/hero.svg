<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c987"/>
      <stop offset="1" stop-color="#c39a45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#cba14e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cba14e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="280" cy="230" r="220" fill="url(#glow)"/>
  <circle cx="280" cy="230" r="180" stroke="url(#gold)" stroke-opacity=".25" stroke-width="1.5"/>
  <circle cx="280" cy="230" r="140" stroke="url(#gold)" stroke-opacity=".15" stroke-width="1.5"/>

  <g stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- iso crate: top face -->
    <path d="M280 120 L408 188 L280 256 L152 188 Z" fill="#cba14e" fill-opacity=".05"/>
    <!-- left face -->
    <path d="M152 188 L280 256 L280 392 L152 324 Z" fill="#cba14e" fill-opacity=".08"/>
    <!-- right face -->
    <path d="M408 188 L280 256 L280 392 L408 324 Z" fill="#cba14e" fill-opacity=".03"/>
    <!-- slats -->
    <path d="M188 207 L316 275 M244 237 L372 305" stroke-opacity=".5"/>
    <path d="M372 207 L244 275 M316 237 L188 305" stroke-opacity=".5"/>
    <path d="M280 256 L280 392" stroke-opacity=".7"/>
  </g>

  <!-- pallet base -->
  <g stroke="url(#gold)" stroke-width="2.4" stroke-opacity=".7" stroke-linecap="round">
    <path d="M150 360 L280 428 L410 360"/>
    <path d="M150 392 L280 460 L410 392"/>
    <path d="M188 414 L188 446 M280 444 L280 476 M372 414 L372 446"/>
  </g>

  <!-- accents -->
  <circle cx="430" cy="120" r="5" fill="url(#gold)"/>
  <circle cx="120" cy="300" r="4" fill="url(#gold)" fill-opacity=".7"/>
  <circle cx="448" cy="300" r="3" fill="url(#gold)" fill-opacity=".6"/>
  <path d="M96 150 l10 0 M101 145 l0 10" stroke="url(#gold)" stroke-width="2" stroke-opacity=".7"/>
