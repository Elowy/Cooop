<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <defs>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c987"/>
      <stop offset="1" stop-color="#c39a45"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="440" height="360" rx="18" stroke="url(#gold2)" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- stacked planks -->
  <g stroke="url(#gold2)" stroke-width="2.4" stroke-linejoin="round">
    <rect x="120" y="150" width="280" height="34" rx="6" fill="#cba14e" fill-opacity=".05"/>
    <rect x="100" y="196" width="280" height="34" rx="6" fill="#cba14e" fill-opacity=".08"/>
    <rect x="140" y="242" width="280" height="34" rx="6" fill="#cba14e" fill-opacity=".05"/>
  </g>

  <!-- growth rings on the ends -->
  <g stroke="url(#gold2)" stroke-width="2" fill="none" stroke-opacity=".7">
    <circle cx="135" cy="167" r="8"/>
    <circle cx="115" cy="213" r="8"/>
    <circle cx="155" cy="259" r="8"/>
  </g>

  <!-- quarter arc accent -->
  <path d="M400 110 a90 90 0 0 1 0 180" stroke="url(#gold2)" stroke-opacity=".4" stroke-width="1.5"/>
  <circle cx="400" cy="110" r="5" fill="url(#gold2)"/>
  <circle cx="400" cy="290" r="4" fill="url(#gold2)" fill-opacity=".7"/>
</svg>
