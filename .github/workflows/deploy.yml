name: Deploy (FTP)

# A main ágra való push után FTP-vel kitelepíti a weboldalt a tárhelyre.
# Kézzel is indítható (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Egyszerre csak egy deploy fusson.
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Kód kicsekkolása
        uses: actions/checkout@v4

      - name: Eszközök verziói
        run: php -v && node -v

      - name: PHP szintaxis-ellenőrzés (teljes kódbázis)
        run: |
          status=0
          while IFS= read -r f; do
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$(php -l "$f" 2>&1 | grep -i error | head -1)"
              status=1
            fi
          done < <(find app public config -name '*.php')
          [ "$status" -eq 0 ] && echo "Minden PHP fájl rendben."
          exit $status

      - name: JS szintaxis-ellenőrzés
        run: node --check public/assets/js/main.js

      - name: CSS zárójel-egyensúly
        run: |
          o=$(grep -o '{' public/assets/css/style.css | wc -l)
          c=$(grep -o '}' public/assets/css/style.css | wc -l)
          echo "Kapcsos zárójelek: { = $o, } = $c"
          [ "$o" = "$c" ] || { echo "::error::CSS zárójel-eltérés a style.css-ben"; exit 1; }

      - name: Egységtesztek
        run: php tests/run.php

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Kód kicsekkolása
        uses: actions/checkout@v4

      - name: FTP titkok ellenőrzése
        id: cfg
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ] && [ -n "${{ secrets.FTP_USERNAME }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hiányoznak az FTP titkok (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) – a deploy kihagyva."
          fi

      - name: FTP deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel általában explicit FTPS-t (TLS) támogat. Ha a tárhely csak sima
          # FTP-t tud, írd át 'ftp'-re (figyelem: jelszó titkosítatlanul megy).
          protocol: ftps
          # A célmappa a tárhelyen. Ha nincs FTP_REMOTE_DIR titok, a gyökérbe ('./') tölt.
          # Tipp cPanelhez: '/public_html/' vagy a projekt mappája (pl. '/nettrade/').
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}
          # Ezeket SOHA ne töltse fel / törölje a szerveren:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            **/*.md
            config/config.local.php
            storage/**
            public/uploads/**
