name: Deploy (FTP)

# A main ágra való push után FTP-vel kitelepíti a weboldalt a tárhelyre.
# Kézzel is indítható (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Egyszerre csak egy deploy fusson.
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kód kicsekkolása
        uses: actions/checkout@v4

      - name: FTP titkok ellenőrzése
        id: cfg
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ] && [ -n "${{ secrets.FTP_USERNAME }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hiányoznak az FTP titkok (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) – a deploy kihagyva."
          fi

      - name: FTP deploy
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel általában explicit FTPS-t (TLS) támogat. Ha a tárhely csak sima
          # FTP-t tud, írd át 'ftp'-re (figyelem: jelszó titkosítatlanul megy).
          protocol: ftps
          # A célmappa a tárhelyen. Ha nincs FTP_REMOTE_DIR titok, a gyökérbe ('./') tölt.
          # Tipp cPanelhez: '/public_html/' vagy a projekt mappája (pl. '/nettrade/').
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}
          # Ezeket SOHA ne töltse fel / törölje a szerveren:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            config/config.local.php
            storage/**
            public/uploads/**
